name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          fi
      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Show signing certificate
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then echo "::notice::Signed with upload key"; else echo "::notice::Signed with default debug key"; fi
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-1" | sed 's/^/::notice::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: WhosSmartest-debug
          path: app/build/outputs/apk/debug/*.apk
      # TAM TAT AAB - chi build APK de test, khoi phuc khi user chot on dinh
      - name: Build release AAB (Google Play)
        if: false
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: WhosSmartest-release-aab
          path: app/build/outputs/bundle/release/*.aab
